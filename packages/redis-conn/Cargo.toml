[package]
name = "redis-conn"
version = "0.1.0"
edition = "2021"

[dependencies]
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "aio", "tokio-rustls-comp", "connection-manager"] }
anyhow = "1.0"
rustls = { version = "0.23.42", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.0", features = ["full"] }
bb8 = "0.8"
bb8-redis = "0.17"
