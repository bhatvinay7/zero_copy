[package]
name = "rabbitmq-conn"
version = "0.1.0"
edition = "2021"

[dependencies]
lapin = { version = "2.5.0", features = ["rustls", "rustls-native-certs"] }
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["ring"] }
