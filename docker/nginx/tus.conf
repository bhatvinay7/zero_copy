# ─────────────────────────────────────────────────────────────────────────────
# Nginx — TUS Upload Server Load Balancer
#
# Round-robin across all tus-server replicas.
# No sticky sessions needed because TUS upload state lives in Redis.
#
# Scale: docker compose up --scale tus-server=3
# ─────────────────────────────────────────────────────────────────────────────

upstream tus_backends {
    # Docker Compose service name resolves to all replicas automatically
    server tus-server:1081;

    # keepalive connections to upstream
    keepalive 32;
}

server {
    listen 1081;
    server_name _;

    # Allow large upload chunks (up to 5 GiB per PATCH request)
    client_max_body_size 5g;

    # TUS protocol requires no request buffering for streaming PATCH uploads
    proxy_request_buffering off;

    # Increase timeouts for large file uploads
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    # Health check endpoint
    location /health {
        proxy_pass         http://tus_backends/health;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # TUS upload routes
    location /files/ {
        proxy_pass         http://tus_backends;
        proxy_http_version 1.1;

        # Required for keepalive with upstream
        proxy_set_header   Connection "";

        # Forward real client info
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass TUS protocol headers through unchanged
        proxy_pass_header  Upload-Offset;
        proxy_pass_header  Upload-Length;
        proxy_pass_header  Tus-Resumable;
        proxy_pass_header  Tus-Version;
        proxy_pass_header  Tus-Extension;
        proxy_pass_header  Tus-Max-Size;
        proxy_pass_header  Location;
    }
}
