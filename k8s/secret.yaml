# ─────────────────────────────────────────────────────────────────────────────
# Secret template — fill in base64-encoded values before applying.
#
# Encode a value:  echo -n "your-value" | base64
# Apply:           kubectl apply -f k8s/secret.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: transcoder-secrets
  namespace: transcoder
type: Opaque
data:
  # echo -n "postgresql://user:pass@host/db?sslmode=require" | base64
  DATABASE_URL: <base64-encoded-database-url>

  # echo -n "redis://default:pass@host:port" | base64
  REDIS_URL: <base64-encoded-redis-url>

  # echo -n "amqps://user:pass@host/vhost" | base64
  RABBITMQ_URL: <base64-encoded-rabbitmq-url>

  # Cloudflare R2
  CLOUDFLARE_R2_ACCOUNT_ID: <base64-encoded-account-id>
  CLOUDFLARE_R2_ACCESS_KEY_ID: <base64-encoded-access-key>
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: <base64-encoded-secret-key>
