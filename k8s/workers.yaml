# ── transcoder Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder
  namespace: transcoder
  labels:
    app: transcoder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transcoder
  template:
    metadata:
      labels:
        app: transcoder
    spec:
      containers:
        - name: transcoder
          image: transcoder/transcoder:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transcoder-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: RABBITMQ_URL
            - name: CLOUDFLARE_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCOUNT_ID
            - name: CLOUDFLARE_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCESS_KEY_ID
            - name: CLOUDFLARE_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
# ── db-worker Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-worker
  namespace: transcoder
  labels:
    app: db-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-worker
  template:
    metadata:
      labels:
        app: db-worker
    spec:
      containers:
        - name: db-worker
          image: transcoder/db-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transcoder-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# ── worker Deployment (Linux nodes only — tokio-uring) ────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: transcoder
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Pin to Linux nodes (tokio-uring is Linux-only)
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: worker
          image: transcoder/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transcoder-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: RABBITMQ_URL
            - name: CLOUDFLARE_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCOUNT_ID
            - name: CLOUDFLARE_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCESS_KEY_ID
            - name: CLOUDFLARE_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
