# ─────────────────────────────────────────────────────────────────────────────
# Kustomization — apply entire stack in one command:
#   kubectl apply -k k8s/
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: transcoder

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis.yaml
  - postgres.yaml
  - db-migrate-job.yaml
  - http-server.yaml
  - tus-server.yaml
  - workers.yaml
  - ingress.yaml
