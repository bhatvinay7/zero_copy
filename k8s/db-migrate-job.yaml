# ── DB Migration Job ──────────────────────────────────────────────────────────
# Runs Diesel migrations to completion before other services start.
# Use as an init step in your CI/CD pipeline or as a Helm hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: transcoder
  labels:
    app: db-migrate
  annotations:
    # Helm lifecycle hook — runs before any Deployment rollout
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: transcoder/db-migrate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: DATABASE_URL
