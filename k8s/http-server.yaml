# ── http-server Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: transcoder
  labels:
    app: http-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: http-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: http-server
          image: transcoder/http-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: transcoder-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: RABBITMQ_URL
            - name: CLOUDFLARE_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCOUNT_ID
            - name: CLOUDFLARE_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_ACCESS_KEY_ID
            - name: CLOUDFLARE_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: transcoder-secrets
                  key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# ── http-server Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: http-server
  namespace: transcoder
  labels:
    app: http-server
spec:
  selector:
    app: http-server
  ports:
    - port: 80
      targetPort: 3000
      name: http
