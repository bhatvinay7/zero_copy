[package]
name = "http-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aws-config = "1.1"
aws-sdk-s3 = "1.38"
bcrypt = "0.15"
jsonwebtoken = "9.3"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "aio", "tokio-rustls-comp", "connection-manager"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }

# Workspace Packages
db = { path = "../../packages/db" }
redis-conn = { path = "../../packages/redis-conn" }
s3-conn = { path = "../../packages/s3-conn" }
rabbitmq-conn = { path = "../../packages/rabbitmq-conn" }
ring = "0.17.14"

[dev-dependencies]
axum-test  = "15"
tokio      = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }
serde_json = "1.0"
dotenvy = "0.15.7"
