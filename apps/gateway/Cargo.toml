[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.5" }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
hyper = { version = "1.0", features = ["full"] }
tower = { version = "0.4.13", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.8.0", features = ["v4"] }
bytes = "1.5"
chrono = "0.4"

# Local packages
redis-conn = { path = "../../packages/redis-conn" }
db = { path = "../../packages/db" }
rabbitmq-conn = { path = "../../packages/rabbitmq-conn" }
