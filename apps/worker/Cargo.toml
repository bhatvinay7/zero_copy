[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
lapin = { version = "2.5.0", features = ["rustls", "rustls-native-certs"] }
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp", "aio", "tokio-rustls-comp", "connection-manager"] }
redis-conn = { path = "../../packages/redis-conn" }
s3-conn = { path = "../../packages/s3-conn" }
rabbitmq-conn = { path = "../../packages/rabbitmq-conn" }
db = { path = "../../packages/db" }
aws-config = "1.1"
aws-sdk-s3 = "1.38"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset", "http2"] }
rustls = { version = "0.23", features = ["ring"] }
bytes = "1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4.0"
